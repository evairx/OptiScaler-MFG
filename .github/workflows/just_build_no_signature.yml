# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build (No Signing)

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main", "optiscaler_dev1", "optiscaler_dev2" ]
  pull_request:
    branches: [ "master", "main", "optiscaler_dev1", "optiscaler_dev2" ]
    
env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: 'true'
        
    - name: Extract Version
      id: get_version
      working-directory: ${{ github.workspace }}
      shell: powershell
      run: |
        # Ensure the file exists before proceeding
        $resourceFile = ".\OptiScaler\resource.h"
        if (-Not (Test-Path $resourceFile)) {
            Write-Error "File not found: $resourceFile"
            exit 1
        }
        
        # Helper function to extract the first matching line for a version component
        function Get-Version-Component {
            param (
                [string]$pattern,
                [string]$replacement
            )
            # Use Select-String and take only the first match
            $line = Get-Content $resourceFile | Select-String -Pattern $pattern | Select-Object -First 1
            if ($line) {
                return ($line.Line -replace $replacement).Trim()
            } else {
                Write-Error "Pattern not found: $pattern"
                exit 1
            }
        }
        
        # Extract version components (only the first match for each pattern)
        $majorVersion = Get-Version-Component 'VER_MAJOR_VERSION' '#define VER_MAJOR_VERSION\s+'
        $minorVersion = Get-Version-Component 'VER_MINOR_VERSION' '#define VER_MINOR_VERSION\s+'
        $hotfixVersion = Get-Version-Component 'VER_HOTFIX_VERSION' '#define VER_HOTFIX_VERSION\s+'
        $buildVersion = Get-Version-Component 'VER_BUILD_NUMBER' '#define VER_BUILD_NUMBER\s+'
        
        # Merge into a single version string
        if ($env:GITHUB_REF_NAME -eq 'optiscaler_dev2') {
            $version = "v10.0.2-dev2-notested"
            $releaseName = "OptiScaler-MFG evairx/optiscaler_dev-2 (no tested)"
        } elseif ($env:GITHUB_REF_NAME -eq 'optiscaler_dev1') {
            $version = "v10.0.2-dev1-notested"
            $releaseName = "OptiScaler-MFG evairx/optiscaler_dev-1 (no tested)"
        } else {
            $version = "v10.0.2-pre3"
            $releaseName = "OptiScaler-MFG v10.0.2-pre3"
        }
        
        # Get the current date in a specific format (e.g., YYYYMMDD)
        $date = Get-Date -Format "yyyyMMdd"
        
        # Construct the output filename with version and date
        $outputFileName = "OptiScaler_${version}_${date}"
        
        # Output the generated filename
        Write-Output "Generated Filename: $outputFileName"
        
        # Write outputs to GITHUB_OUTPUT
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "filename=$outputFileName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        
      continue-on-error: false
      
    - name: Debug Outputs
      run: |
        echo "Version: ${{ steps.get_version.outputs.version }}"
        echo "Filename: ${{ steps.get_version.outputs.filename }}"
        
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # NR's runtime (nvngx_dlssnr.dll) is NVIDIA's, ~165 MB, and cannot live in
    # the repository. Fetch it into external/dlss/ so the PostBuild copy picks
    # it up, or skip and ship without it. Override the source with the
    # NVNGX_DLSSNR_URL repository variable.
    - name: Fetch nvngx_dlssnr.dll (optional)
      shell: pwsh
      run: |
        $url = "${{ vars.NVNGX_DLSSNR_URL }}"
        if ([string]::IsNullOrWhiteSpace($url)) {
            $url = "https://github.com/${{ github.repository }}/releases/download/nr-runtime/nvngx_dlssnr.dll"
        }
        try {
            New-Item -ItemType Directory -Force -Path "external/dlss" | Out-Null
            Invoke-WebRequest -Uri $url -OutFile "external/dlss/nvngx_dlssnr.dll" -UseBasicParsing
            $hash = (Get-FileHash "external/dlss/nvngx_dlssnr.dll" -Algorithm SHA256).Hash
            Write-Host "Fetched nvngx_dlssnr.dll ($url), SHA256 $hash"
        } catch {
            Write-Warning "nvngx_dlssnr.dll not available ($url); building without the NR runtime."
        }

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}} /verbosity:minimal
      
    - name: Compress the artifact 
      run: |
        $zipName = "${{ steps.get_version.outputs.filename }}.7z"
        7z a -r ${{ github.workspace }}\$zipName ${{ github.workspace }}\x64\Release\a\*.*

      continue-on-error: false
        
    - uses: actions/upload-artifact@v7.0.0
      with:
        name: '${{ steps.get_version.outputs.filename }}'
        path: '${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z'
        archive: false
        compression-level: 0
        if-no-files-found: error

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: ${{ steps.get_version.outputs.release_name }}
        body_path: RELEASE_NOTES.md
        draft: ${{ !startsWith(github.ref_name, 'optiscaler_dev') }}
        prerelease: true
        files: ${{ github.workspace }}/${{ steps.get_version.outputs.filename }}.7z
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
